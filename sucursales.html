<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sucursales — Contact Center Hub</title>
<link rel="stylesheet" href="assets/css/sidebar.css">
<link rel="stylesheet" href="assets/css/hub.css">
</head>
<body>
<div class="app">

  <div id="sidebar"></div>

  <div class="main">

    <div class="topbar">

        <h1>📍 Sucursales</h1>
        <p>Dónde está cada salón de venta, qué marcas vende y cómo contactarlo</p>

      <a href="index.html" style="font-size:12px;color:var(--blue);font-weight:600;">← Volver al inicio</a>

    <div class="ts-filtros">

    <!-- ===== SUCURSALES (se arman desde assets/js/sucursales.js) ===== -->
    <div class="ts-grid" id="listaSucursales"></div>

        <div class="t"><span class="sq" style="background:var(--green)">🗺️</span>CONCESIONARIOS EN EL INTERIOR</div>
