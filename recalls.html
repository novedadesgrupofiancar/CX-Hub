<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recalls activos — Contact Center Hub</title>
<link rel="stylesheet" href="assets/css/sidebar.css">
<link rel="stylesheet" href="assets/css/hub.css">
</head>
<body>
<div class="app">

  <div id="sidebar"></div>

  <div class="main">

    <div class="topbar">
      <div class="greeting">
        <h1>🛠️ Recalls activos</h1>
        <p>Campañas de seguridad vigentes de todas las marcas</p>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <a href="index.html" style="font-size:12px;color:var(--blue);font-weight:600;">← Volver al inicio</a>
      </div>
    </div>

    <div class="card recalls" id="recallsPageList" style="margin-bottom:16px;">
      <div class="card-head">
        <div class="t" style="color:#fff"><span class="sq" style="background:rgba(255,255,255,.28)">🛠️</span>2 RECALLS ACTIVOS</div>
      </div>

      <div class="recall-grid">
        <div class="promo-item on-white recall-item">
          <div class="promo-txt">
            <div class="brandtag">CHEVROLET</div>
            <b>Campaña de airbag</b>
            <p>Reemplazo del inflador del airbag Takata · Celta y Cruze · Recall sin costo</p>
          </div>
        </div>

        <div class="promo-item on-white recall-item">
          <div class="promo-txt">
            <div class="brandtag">CHEVROLET</div>
            <b>Campaña de Spark</b>
            <p>Campaña de actualización · Spark EUV · Sin costo</p>
          </div>
        </div>
      </div>
    </div>

    <div data-hub-footer></div>

  </div>
</div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="Vista ampliada">
</div>

<script src="assets/js/hub.js"></script>
</body>
</html>
