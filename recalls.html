<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recalls activos — Contact Center Hub</title>
<link rel="stylesheet" href="assets/css/sidebar.css">
<link rel="stylesheet" href="assets/css/hub.css">
</head>
<body>
<div class="app">

  <div id="sidebar"></div>

  <div class="main">

    <div class="topbar">
      <div class="greeting">
        <h1>🛠️ Recalls activos</h1>
        <p>Campañas de seguridad vigentes de todas las marcas</p>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <a href="index.html" style="font-size:12px;color:var(--blue);font-weight:600;">← Volver al inicio</a>
      </div>
    </div>

    <!-- Solo en modo admin (botón "Ingresar como admin" del menú lateral) -->
    <div class="cr-admin-banner rc-solo-admin">
      <span>🔐 <b>Modo administrador.</b> Tocá ✏️ en una tarjeta para editarla. Lo que guardes lo ve todo el equipo.</span>
      <span style="display:flex;gap:8px;">
        <button type="button" onclick="nuevoRC()">＋ Nuevo recall</button>
        <button type="button" onclick="salirAdmin()">Salir del modo admin</button>
      </span>
    </div>

    <div id="rcAviso" hidden></div>

    <!-- Las tarjetas se guardan en la planilla del Hub (hoja "Recalls") y las arma assets/js/recalls.js.
         Cada tarjeta abre la planilla de gestión de la campaña en el Drive. -->
    <div class="card recalls" id="recallsPageList" style="margin-bottom:16px;">
      <div class="card-head">
        <div class="t" style="color:#fff"><span class="sq" style="background:rgba(255,255,255,.28)">🛠️</span><span id="rcTitulo">RECALLS ACTIVOS</span></div>
      </div>
      <div class="recall-grid" id="rcLista"><div class="rc-vacio">Cargando…</div></div>
    </div>

    <div data-hub-footer></div>

  </div>
</div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="Vista ampliada">
</div>

<script src="assets/js/hub.js"></script>
<script src="assets/js/recalls.js"></script>
</body>
</html>
